                        dark: { 800: '#1f2937', 900: '#111827' }
                    },

                }
            }
        }

    <link rel="stylesheet" href="//fonts.googleapis.com/css2?family=Nunito+Sans:ital,wght@0,300;0,400;0,600;0,700;0,800;1,300;1,400;1,600;1,700;1,800&display=swap">
    <script crossorigin="anonymous" src="https://kit.fontawesome.com/08ce533d2a.js"></script>
    <style>
        :root { --color-brand-primary: #ee243c; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #d1d5db; }
        .toggle-checkbox:checked { right: 0; border-color: var(--color-brand-primary); }
        .toggle-checkbox:checked + .toggle-label { background-color: var(--color-brand-primary); }
        .toggle-checkbox { right: 1.5rem; transition: all 0.3s ease; width: 1.5rem; height: 1.5rem; top: 0; }
        .toggle-checkbox:checked { right: 0; }
        .toggle-label { width: 3rem; height: 1.5rem; }
    </style>
