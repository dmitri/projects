<html lang="en">

  <head>
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade &amp; Message Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin="anonymous" src="https://kit.fontawesome.com/08ce533d2a.js"></script>
    <script>
      window.FontAwesomeConfig = {
        autoReplaceSvg: 'nest'
      };
    </script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"
      crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap"
      rel="stylesheet">
    <script>
      tailwind.config = {
        theme:
        {
          extend:
          {
            fontFamily:
            {
              sans: ['Inter', 'sans-serif'],
            },
            colors:
            {
              primary: '#0ea5e9',
              surface: '#f8fafc',
              border: '#e2e8f0',
              textMain: '#334155',
              textMuted: '#94a3b8'
            }
          }
        }
      }
    </script>
    <style>
      ::-webkit-scrollbar
      {
        display: none;
      }

      body
      {
        -ms-overflow-style: none;
        scrollbar-width: none;
        background-color: #f1f5f9;
      }
    </style>
  </head>

  <body
    class="min-h-screen p-4 md:p-8 flex flex-col items-center justify-center space-y-8">
    <!-- Desktop View -->
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade &amp; Message Editor</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap"
      rel="stylesheet">
    <div id="desktop-container"
      class="w-full max-w-4xl hidden md:flex flex-col space-y-6">
      <h2 class="text-xl font-semibold text-textMain mb-2">Desktop Layout</h2>
      <!-- Grading Component (Separated) -->
      <div id="desktop-grading-bar"
        class="bg-white rounded-lg border border-border shadow-sm p-4 flex items-center justify-between">
        <div class="flex items-center space-x-2"><span
            class="text-sm font-medium text-textMain mr-2">Assign Grade:</span>
          <div
            class="flex border border-border rounded-md overflow-hidden bg-surface">
            <button
              class="px-3 py-1.5 text-sm font-medium hover:bg-white hover:text-primary border-r border-border transition-colors">A</button><button
              class="px-3 py-1.5 text-sm font-medium hover:bg-white hover:text-primary border-r border-border transition-colors">A-</button><button
              class="px-3 py-1.5 text-sm font-medium hover:bg-white hover:text-primary border-r border-border transition-colors">B+</button><button
              class="px-3 py-1.5 text-sm font-medium hover:bg-white hover:text-primary border-r border-border transition-colors">B</button><button
              class="px-3 py-1.5 text-sm font-medium hover:bg-white hover:text-primary border-r border-border transition-colors">B-</button><button
              class="px-3 py-1.5 text-sm font-medium hover:bg-white hover:text-primary border-r border-border transition-colors">C+</button><button
              class="px-3 py-1.5 text-sm font-medium hover:bg-white hover:text-primary border-r border-border transition-colors">C</button><button
              class="px-3 py-1.5 text-sm font-medium hover:bg-white hover:text-primary border-r border-border transition-colors">C-</button><button
              class="px-3 py-1.5 text-sm font-medium hover:bg-white hover:text-primary border-r border-border transition-colors">D</button><button
              class="px-3 py-1.5 text-sm font-medium hover:bg-white hover:text-primary transition-colors">F</button>
          </div>
          <div class="h-6 w-px bg-border mx-2"></div><button
            class="p-1.5 text-textMuted hover:text-textMain rounded-md hover:bg-surface transition-colors"><i
              class="fa-solid fa-ban"></i></button><button
            class="p-1.5 text-textMuted hover:text-textMain rounded-md hover:bg-surface transition-colors"><i
              class="fa-solid fa-rotate-exclamation"></i></button>
        </div>
        <div class="flex items-center space-x-3">
          <div class="relative"><input type="text" value="999"
              class="w-20 pl-3 pr-6 py-1.5 border border-border rounded-md text-sm text-right focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary"><span
              class="absolute right-2 top-1/2 -translate-y-1/2 text-textMuted text-sm">%</span>
          </div>
        </div>
      </div><!-- Rich Text Editor Component -->
      <div id="desktop-editor"
        class="bg-white rounded-lg border border-border shadow-sm flex flex-col h-[400px]">
        <!-- Toolbar -->
        <div
          class="flex items-center justify-between p-2 border-b border-border bg-surface rounded-t-lg">
          <div class="flex items-center space-x-1"><button
              class="p-2 text-textMain hover:bg-white rounded hover:shadow-sm transition-all"><i
                class="fa-solid fa-bold"></i></button><button
              class="p-2 text-textMain hover:bg-white rounded hover:shadow-sm transition-all"><i
                class="fa-solid fa-italic"></i></button><button
              class="p-2 text-textMain hover:bg-white rounded hover:shadow-sm transition-all"><i
                class="fa-solid fa-text-height"></i></button>
            <div class="h-5 w-px bg-border mx-1"></div><button
              class="p-2 text-textMain hover:bg-white rounded hover:shadow-sm transition-all"><i
                class="fa-solid fa-link"></i></button><button
              class="p-2 text-textMain hover:bg-white rounded hover:shadow-sm transition-all"><i
                class="fa-solid fa-list-ul"></i></button><button
              class="p-2 text-textMain hover:bg-white rounded hover:shadow-sm transition-all"><i
                class="fa-solid fa-list-ol"></i></button>
            <div class="h-5 w-px bg-border mx-1"></div><button
              class="p-2 text-textMain hover:bg-white rounded hover:shadow-sm transition-all"><i
                class="fa-solid fa-music"></i></button><button
              class="p-2 text-textMain hover:bg-white rounded hover:shadow-sm transition-all"><i
                class="fa-solid fa-code"></i></button><button
              class="p-2 text-textMain hover:bg-white rounded hover:shadow-sm transition-all"><i
                class="fa-regular fa-face-smile"></i></button>
              <button
              class="p-2 text-textMain hover:bg-white rounded hover:shadow-sm transition-all"><i
                class="fa-regular fa-folder"></i></button>
          </div>
          <div class="flex items-center space-x-3 pr-2"><span
              class="text-xs text-textMuted">Draft Saved</span><button
              class="text-textMuted hover:text-textMain"><i
                class="fa-solid fa-expand"></i></button><button
              class="text-textMuted hover:text-textMain"><i
                class="fa-solid fa-chevron-down"></i></button></div>
        </div><!-- Editor Area -->
        <div class="flex-1 p-4">
          <textarea placeholder="Include a message about the assignment?" class="w-full h-full resize-none outline-none text-textMain placeholder-textMuted"></textarea>
        </div><!-- Footer Actions -->
        <div
          class="p-3 flex justify-between items-center bg-white rounded-b-lg border-t border-border">
          <div class="flex items-center"><button
              class="p-2 text-textMuted hover:text-textMain rounded-full hover:bg-surface transition-colors border border-border"><i
                class="fa-solid fa-paperclip"></i></button></div>
          <div class="flex items-center space-x-4"><a href="#"
              class="text-sm font-medium text-textMuted hover:text-primary transition-colors underline-offset-2 hover:underline border border-t-0 border-r-0 border-l-0"
              id="i4xc3">
              <i class="fa-regular fa-floppy-disk"></i> Save as Draft
            </a><button
              class="p-2.5 bg-primary text-white rounded-full hover:bg-sky-600 transition-colors shadow-sm"><i
                class="fa-regular fa-paper-plane"></i></button></div>
        </div>
      </div>
    </div><!-- Mobile View -->
    <div id="mobile-container"
      class="w-full max-w-md md:hidden flex flex-col space-y-4">
      <h2 class="text-xl font-semibold text-textMain mb-2">Mobile Layout</h2>
      <!-- Grading Component (Separated & Scrollable) -->
      <div id="mobile-grading-bar"
        class="bg-white rounded-lg border border-border shadow-sm p-3 flex flex-col space-y-3">
        <div class="flex items-center justify-between"><span
            class="text-sm font-medium text-textMain">Assign Grade</span>
          <div class="flex items-center space-x-2">
            <div class="relative"><input type="text" value="999"
                class="w-16 pl-2 pr-5 py-1 border border-border rounded text-sm text-right focus:outline-none focus:border-primary"><span
                class="absolute right-1.5 top-1/2 -translate-y-1/2 text-textMuted text-xs">%</span>
            </div>
          </div>
        </div>
        <div class="flex items-center space-x-2">
          <div class="flex-1 overflow-x-auto pb-1 -mb-1 hide-scrollbar">
            <div class="flex border border-border rounded-md bg-surface w-max">
              <button
                class="px-3 py-1.5 text-sm font-medium hover:bg-white hover:text-primary border-r border-border">A</button><button
                class="px-3 py-1.5 text-sm font-medium hover:bg-white hover:text-primary border-r border-border">A-</button><button
                class="px-3 py-1.5 text-sm font-medium hover:bg-white hover:text-primary border-r border-border">B+</button><button
                class="px-3 py-1.5 text-sm font-medium hover:bg-white hover:text-primary border-r border-border">B</button><button
                class="px-3 py-1.5 text-sm font-medium hover:bg-white hover:text-primary border-r border-border">B-</button><button
                class="px-3 py-1.5 text-sm font-medium hover:bg-white hover:text-primary border-r border-border">C+</button><button
                class="px-3 py-1.5 text-sm font-medium hover:bg-white hover:text-primary border-r border-border">C</button><button
                class="px-3 py-1.5 text-sm font-medium hover:bg-white hover:text-primary border-r border-border">C-</button><button
                class="px-3 py-1.5 text-sm font-medium hover:bg-white hover:text-primary border-r border-border">D</button><button
                class="px-3 py-1.5 text-sm font-medium hover:bg-white hover:text-primary">F</button>
            </div>
          </div>
          <div class="flex items-center space-x-1 pl-1 border-l border-border">
            <button
              class="p-1.5 text-textMuted hover:text-textMain rounded bg-surface"><i
                class="fa-solid fa-ban text-xs"></i></button><button
              class="p-1.5 text-textMuted hover:text-textMain rounded bg-surface"><i
                class="fa-regular fa-rotate-exclamation text-xs"></i></button></div>
        </div>
      </div><!-- Rich Text Editor Component -->
      <div id="mobile-editor"
        class="bg-white rounded-lg border border-border shadow-sm flex flex-col h-[350px]">
        <!-- Toolbar (Scrollable) -->
        <div
          class="overflow-x-auto pb-1 -mb-1 border-b border-border bg-surface rounded-t-lg hide-scrollbar">
          <div class="flex items-center p-2 w-max space-x-1"><button
              class="p-2 text-textMain hover:bg-white rounded"><i
                class="fa-solid fa-bold"></i></button><button
              class="p-2 text-textMain hover:bg-white rounded"><i
                class="fa-solid fa-italic"></i></button>
            <div class="h-4 w-px bg-border mx-1"></div><button
              class="p-2 text-textMain hover:bg-white rounded"><i
                class="fa-solid fa-link"></i></button><button
              class="p-2 text-textMain hover:bg-white rounded"><i
                class="fa-solid fa-list-ul"></i></button>
            <div class="h-4 w-px bg-border mx-1"></div><button
              class="p-2 text-textMain hover:bg-white rounded"><i
                class="fa-regular fa-face-smile"></i></button><button
              class="p-2 text-textMain hover:bg-white rounded"><i
                class="fa-regular fa-folder"></i></button>
          </div>
        </div><!-- Editor Area -->
        <div class="flex-1 p-3">
          <textarea placeholder="Include a message about the assignment? Message Firstname..." class="w-full h-full resize-none outline-none text-sm text-textMain placeholder-textMuted"></textarea>
        </div><!-- Footer Actions -->
        <div
          class="p-2 flex justify-between items-center bg-white rounded-b-lg border-t border-border">
          <div class="flex items-center"><button
              class="p-2 text-textMuted hover:text-textMain rounded-full border border-border"><i
                class="fa-solid fa-paperclip"></i></button></div>
          <div class="flex items-center space-x-3"><a href="#"
              class="text-xs font-medium text-textMuted hover:text-primary underline-offset-2 hover:underline">
              Save as Draft
            </a><button
              class="p-2 bg-primary text-white rounded-full shadow-sm"><i
                class="fa-solid fa-paper-plane"></i></button></div>
        </div>
      </div>
    </div>
  </body>

</html>
